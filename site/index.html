<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu primeiro deploy automatizado</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, #dbeafe, var(--bg));
        color: var(--text);
      }

      main {
        background: var(--card);
        padding: 2rem;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        max-width: 640px;
        text-align: center;
      }

      h1 {
        margin-top: 0;
        color: var(--accent);
      }

      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Deploy novo teste</h1>
      <p>
        Esta pagina foi publicada automaticamente usando GitHub Actions com pipeline
        de CI/CD.
      </p>
    </main>
  </body>
</html>
